<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Successful | UPI Gateway</title>
    <meta name="description" content="Your UPI payment was verified successfully. Order receipt and transaction reference." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap narrow center">
      <div class="card">
        <p class="big">✅</p>
        <h1>Payment received</h1>
        <p class="hint" id="detail">Verifying receipt…</p>
        <p><a href="/checkout.html">Make another payment</a></p>
      </div>
    </div>
    <script>
      const id = new URLSearchParams(location.search).get("order_id");
      if (id) {
        fetch("/api/status/" + id)
          .then((r) => r.json())
          .then((d) => {
            document.getElementById("detail").textContent =
              "Order " + d.order_id + " • ₹" + Number(d.amount).toFixed(2) + (d.txid ? " • Ref " + d.txid : "");
          })
          .catch(() => {});
      } else {
        document.getElementById("detail").textContent = "";
      }
    </script>
  </body>
</html>
