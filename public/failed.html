<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Failed | UPI Gateway</title>
    <meta name="description" content="We could not verify this UPI payment. Retry the checkout or contact support with your order ID." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap narrow center">
      <div class="card">
        <p class="big">⚠️</p>
        <h1>Payment not verified</h1>
        <p class="hint" id="detail">We couldn't confirm this transaction.</p>
        <p><a href="/checkout.html">Try again</a></p>
      </div>
    </div>
    <script>
      const id = new URLSearchParams(location.search).get("order_id");
      if (id) document.getElementById("detail").textContent = "Order " + id + " could not be verified.";
    </script>
  </body>
</html>
